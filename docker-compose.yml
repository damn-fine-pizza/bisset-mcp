services:

  workflow_server:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        SERVICE: workflow_server
    command:
      - uvicorn
      - orchestrator.workflow_server.app:app
      - --host
      - "0.0.0.0"
      - --port
      - "${WORKFLOW_SERVER_PORT:-8765}"
    ports:
      - "${WORKFLOW_SERVER_PORT:-8765}:${WORKFLOW_SERVER_PORT:-8765}"
    volumes:
      - bisset-db:/data
    env_file:
      - path: claude/.env
        required: false
    environment:
      DATABASE_PATH: /data/workflow.db
      WORKFLOW_SERVER_PORT: "${WORKFLOW_SERVER_PORT:-8765}"
      WORKFLOW_PRETTY_JSON_LOGS: "${WORKFLOW_PRETTY_JSON_LOGS:-1}"
      BDD_COVERAGE_THRESHOLD: "${BDD_COVERAGE_THRESHOLD:-80}"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c",
             "import urllib.request; urllib.request.urlopen('http://localhost:${WORKFLOW_SERVER_PORT:-8765}/health')"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 5s

  mcp_server:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        SERVICE: mcp_server
    command:
      - python
      - -m
      - orchestrator.mcp_server
    depends_on:
      workflow_server:
        condition: service_healthy
    env_file:
      - path: claude/.env
        required: false
    environment:
      MCP_SERVER_HOST: "http://workflow_server:${WORKFLOW_SERVER_PORT:-8765}"
      CLAUDE_API_KEY: "${CLAUDE_API_KEY:-}"
      CLAUDE_DEFAULT_MODEL: "${CLAUDE_DEFAULT_MODEL:-claude-3-5-sonnet-20241022}"
    stdin_open: true
    tty: false
    restart: unless-stopped

volumes:
  bisset-db:
    name: bisset-db
