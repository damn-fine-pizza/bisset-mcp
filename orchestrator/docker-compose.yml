version: '3.8'

x-agent-env: &agent-env
  MCP_URL: http://mcp:3000
  OPENAI_API_KEY: ${OPENAI_API_KEY}
  LLM_MODEL: ${LLM_MODEL:-gpt-4o-mini}

services:
  mcp:
    image: node:18
    container_name: mcp
    volumes:
      - ../mcp-example:/srv
    working_dir: /srv
    command: sh -c "npm install --no-audit --no-fund && npm start"
    ports:
      - "3000:3000"

  orchestrator:
    image: python:3.11-slim
    container_name: orchestrator
    volumes:
      - ./orchestrator:/srv/orchestrator
    working_dir: /srv/orchestrator
    environment:
      MCP_URL: http://mcp:3000
    command: sh -c "pip install -r requirements.txt && python app.py"
    ports:
      - "8080:8080"
    depends_on:
      - mcp

  agent-sw-architect:
    image: python:3.11-slim
    container_name: agent-sw-architect
    volumes:
      - ./agents/agent-sw-architect:/srv
    working_dir: /srv
    environment:
      <<: *agent-env
    command: sh -c "pip install -r requirements.txt && python app.py"
    ports:
      - "8101:8000"

  agent-product-owner:
